
    font-size: <!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI로 포켓몬 찾기</title>
<style>
  :root {
    --cream: #FFF8E7;
    --cream-dark: #FCEFC7;
    --yellow: #FFD54F;
    --yellow-deep: #FFB300;
    --brown: #6D4C1B;
    --brown-light: #A67C3D;
    --white: #FFFFFF;
    --shadow: rgba(180, 140, 40, 0.25);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, var(--cream) 0%, var(--cream-dark) 100%);
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    color: var(--brown);
    display: flex;
    justify-content: center;
    padding: 24px 16px 60px;
  }

  .wrap {
    width: 100%;
    max-width: 720px;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  header h1 {
    font-size: 2.2rem;
    margin: 0 0 8px;
    color: var(--brown);
  }

  header p {1.1rem;
    color: var(--brown-light);
    margin: 0;
  }

  .card-box {
    background: var(--white);
    border-radius: 24px;
    padding: 28px 24px;
    box-shadow: 0 8px 24px var(--shadow);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  @media (max-width: 480px) {
    .grid {
      grid-template-columns: repeat(2, 1fr);
    }
    header h1 {
      font-size: 1.7rem;
    }
  }

  .mbti-btn {
    background: var(--cream-dark);
    border: 3px solid transparent;
    border-radius: 16px;
    padding: 18px 8px;
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--brown);
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }

  .mbti-btn:hover {
    background: var(--yellow);
    transform: translateY(-3px);
  }

  .mbti-btn:active {
    transform: translateY(0);
  }

  .mbti-btn.selected {
    background: var(--yellow-deep);
    color: var(--white);
    border-color: var(--brown-light);
  }

  .result {
    display: none;
    margin-top: 28px;
    text-align: center;
    animation: pop 0.35s ease;
  }

  .result.show {
    display: block;
  }

  @keyframes pop {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: scale(1); }
  }

  .result-badge {
    display: inline-block;
    background: var(--yellow);
    color: var(--brown);
    font-weight: 800;
    padding: 6px 18px;
    border-radius: 999px;
    font-size: 1rem;
    margin-bottom: 12px;
  }

  .emoji-big {
    font-size: 5.5rem;
    line-height: 1;
    margin: 6px 0;
  }

  .poke-name {
    font-size: 2rem;
    font-weight: 900;
    color: var(--brown);
    margin: 4px 0 14px;
  }

  .reason-box {
    background: var(--cream-dark);
    border-radius: 16px;
    padding: 18px 20px;
    text-align: left;
    font-size: 1.15rem;
    line-height: 1.7;
    color: var(--brown);
    margin-bottom: 18px;
  }

  .compat-box {
    background: #FFFDF3;
    border: 2px dashed var(--yellow-deep);
    border-radius: 16px;
    padding: 16px 18px;
    text-align: left;
    margin-bottom: 22px;
  }

  .compat-box .label {
    font-size: 1rem;
    font-weight: 800;
    color: var(--yellow-deep);
    margin-bottom: 6px;
  }

  .compat-line {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.15rem;
    font-weight: 700;
  }

  .compat-emoji {
    font-size: 2.2rem;
  }

  .retry-btn {
    background: var(--brown);
    color: var(--white);
    border: none;
    border-radius: 999px;
    padding: 14px 32px;
    font-size: 1.15rem;
    font-weight: 800;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
  }

  .retry-btn:hover {
    background: var(--brown-light);
    transform: translateY(-2px);
  }

  .hint {
    text-align: center;
    color: var(--brown-light);
    font-size: 1rem;
    margin-top: 18px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🍃 MBTI로 포켓몬 찾기 🍃</h1>
    <p>내 성격 유형을 골라서 나와 닮은 포켓몬을 만나보세요!</p>
  </header>

  <div class="card-box">
    <div class="grid" id="mbtiGrid"></div>

    <p class="hint" id="hintText">위에서 나의 MBTI를 눌러보세요 👆</p>

    <div class="result" id="resultBox">
      <div class="result-badge" id="resultType"></div>
      <div class="emoji-big" id="resultEmoji"></div>
      <div class="poke-name" id="resultName"></div>
      <div class="reason-box" id="resultReason"></div>

      <div class="compat-box">
        <div class="label">💛 이런 친구랑도 잘 맞아요</div>
        <div class="compat-line">
          <span class="compat-emoji" id="compatEmoji"></span>
          <span id="compatText"></span>
        </div>
      </div>

      <button class="retry-btn" onclick="resetChoice()">🔄 다시 고르기</button>
    </div>
  </div>
</div>

<script>
  const data = {
    "ISTJ": {
      name: "딱구리", emoji: "🦫",
      reason: "성실하고 계획적이며, 맡은 일은 끝까지 책임지고 해내는 모습이 꼭 닮았어요.\n한번 정한 규칙과 원칙은 흔들림 없이 지켜나가는 든든한 성격이에요.",
      compat: "ISFJ", compatEmoji: "🐢", compatText: "차분하고 신뢰가 가는 ISFJ와 찰떡궁합!"
    },
    "ISFJ": {
      name: "photo(피죤투)", emoji: "🐦",
      reason: "묵묵히 주변을 살피고 소중한 존재를 지켜주는 다정함이 매력이에요.\n겉으로 티는 안 내도 든든하게 챙겨주는 보호자 같은 타입이에요.",
      compat: "ISTJ", compatEmoji: "🦫", compatText: "안정적이고 성실한 ISTJ와 잘 어울려요!"
    },
    "INFJ": {
      name: "뮤", emoji: "🧬",
      reason: "신비롭고 깊은 통찰력을 지녔지만 좀처럼 속을 다 보여주지 않아요.\n조용히 세상을 더 나은 방향으로 이끌고 싶어하는 이상주의자예요.",
      compat: "ENFP", compatEmoji: "🦊", compatText: "밝고 자유로운 ENFP가 활력을 불어넣어줘요!"
    },
    "INTJ": {
      name: "뮤츠", emoji: "🔮",
      reason: "치밀한 전략과 압도적인 실력으로 목표를 향해 나아가는 완벽주의자예요.\n혼자만의 시간 속에서 큰 그림을 그리는 걸 좋아해요.",
      compat: "ENTP", compatEmoji: "🐉", compatText: "재치있고 도전적인 ENTP와 시너지가 좋아요!"
    },
    "ISTP": {
      name: "리자몽", emoji: "🔥",
      reason: "말보다 행동으로 보여주는 쿨한 매력의 소유자예요.\n위기 상황에서 오히려 침착하게 문제를 해결하는 능력자죠.",
      compat: "ESFJ", compatEmoji: "🐩", compatText: "따뜻하게 챙겨주는 ESFJ와 균형이 잘 맞아요!"
    },
    "ISFP": {
      name: "이브이", emoji: "🦊",
      reason: "부드럽고 자유로운 감성을 지녔으며, 자기만의 방식으로 세상을 느껴요.\n다양한 모습으로 진화하듯 유연하게 변화에 적응해요.",
      compat: "ESTJ", compatEmoji: "🐗", compatText: "든든하게 이끌어주는 ESTJ가 좋은 짝꿍이에요!"
    },
    "INFP": {
      name: "라프라스", emoji: "🌊",
      reason: "따뜻한 마음과 풍부한 상상력으로 주변을 감싸주는 존재예요.\n조용히 자신만의 가치와 이상을 소중히 여기는 몽상가예요.",
      compat: "ENFJ", compatEmoji: "🦢", compatText: "이끌어주고 응원해주는 ENFJ와 잘 통해요!"
    },
    "INTP": {
      name: "메타몽", emoji: "🟣",
      reason: "호기심 가득한 눈으로 세상의 원리를 탐구하는 걸 좋아해요.\n틀에 박히지 않고 자유자재로 생각을 바꾸는 유연한 사고의 소유자예요.",
      compat: "ENTJ", compatEmoji: "🦁", compatText: "추진력 있는 ENTJ가 아이디어를 현실로 만들어줘요!"
    },
    "ESTP": {
      name: "윈디", emoji: "🐕",
      reason: "에너지 넘치고 순간의 재미를 놓치지 않는 행동파예요.\n망설임 없이 바로 뛰어드는 대담함이 진짜 매력이죠.",
      compat: "ISFJ", compatEmoji: "🐦", compatText: "차분하게 뒷받침해주는 ISFJ와 균형이 좋아요!"
    },
    "ESFP": {
      name: "피카츄", emoji: "⚡",
      reason: "밝고 사랑스러운 매력으로 어디서든 인기 만점이에요.\n함께 있으면 즐겁고 에너지가 솟아나는 분위기 메이커예요.",
      compat: "ISTJ", compatEmoji: "🦫", compatText: "든든하게 챙겨주는 ISTJ와 잘 어울려요!"
    },
    "ENFP": {
      name: "치코리타", emoji: "🌿",
      reason: "호기심 많고 사람을 좋아하며, 늘 새로운 가능성을 찾아 나서요.\n주변에 긍정 에너지를 퍼뜨리는 사랑스러운 성격이에요.",
      compat: "INFJ", compatEmoji: "🧬", compatText: "깊이 있게 이해해주는 INFJ와 특별한 케미!"
    },
    "ENTP": {
      name: "또가스", emoji: "💨",
      reason: "톡톡 튀는 아이디어와 재치로 주변을 즐겁게 하는 타입이에요.\n논쟁도 즐기고 새로운 시도를 두려워하지 않아요.",
      compat: "INTJ", compatEmoji: "🔮", compatText: "깊이 있는 INTJ와 아이디어를 나누면 최고예요!"
    },
    "ESTJ": {
      name: "괴력몬", emoji: "💪",
      reason: "확실한 기준과 리더십으로 팀을 이끄는 타입이에요.\n맡은 일은 끝까지 밀어붙이는 강한 추진력이 특징이에요.",
      compat: "ISFP", compatEmoji: "🦊", compatText: "부드럽게 감싸주는 ISFP와 좋은 균형을 이뤄요!"
    },
    "ESFJ": {
      name: "푸린", emoji: "🎀",
      reason: "다정하고 사교적이며, 사람들 사이의 화합을 중요하게 여겨요.\n주변을 챙기고 분위기를 부드럽게 만드는 재주가 있어요.",
      compat: "ISTP", compatEmoji: "🔥", compatText: "쿨하고 독립적인 ISTP와 잘 어울려요!"
    },
    "ENFJ": {
      name: "가디안", emoji: "🌟",
      reason: "따뜻한 카리스마로 사람들을 이끌고 성장시키는 능력이 있어요.\n타인의 마음을 잘 헤아리는 진정한 리더형이에요.",
      compat: "INFP", compatEmoji: "🌊", compatText: "섬세한 감성의 INFP와 깊은 유대를 느껴요!"
    },
    "ENTJ": {
      name: "gyarados(갸라도스)", emoji: "🐲",
      reason: "강한 카리스마와 추진력으로 목표를 향해 거침없이 나아가요.\n타고난 리더십으로 주변을 이끄는 힘이 넘치는 성격이에요.",
      compat: "INTP", compatEmoji: "🟣", compatText: "기발한 아이디어의 INTP와 최강 조합!"
    }
  };

  const grid = document.getElementById('mbtiGrid');
  const resultBox = document.getElementById('resultBox');
  const hintText = document.getElementById('hintText');

  Object.keys(data).forEach(type => {
    const btn = document.createElement('button');
    btn.className = 'mbti-btn';
    btn.textContent = type;
    btn.onclick = () => selectType(type, btn);
    grid.appendChild(btn);
  });

  function selectType(type, btnEl) {
    document.querySelectorAll('.mbti-btn').forEach(b => b.classList.remove('selected'));
    btnEl.classList.add('selected');

    const info = data[type];
    document.getElementById('resultType').textContent = type;
    document.getElementById('resultEmoji').textContent = info.emoji;
    document.getElementById('resultName').textContent = info.name;
    document.getElementById('resultReason').innerHTML = info.reason.replace(/\n/g, '<br>');
    document.getElementById('compatEmoji').textContent = info.compatEmoji;
    document.getElementById('compatText').textContent = info.compatText;

    resultBox.classList.add('show');
    hintText.style.display = 'none';

    resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function resetChoice() {
    document.querySelectorAll('.mbti-btn').forEach(b => b.classList.remove('selected'));
    resultBox.classList.remove('show');
    hintText.style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>
</body>
</html>
